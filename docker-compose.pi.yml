# ============================================================================
# ClimaZone — Docker pour l'automate (Raspberry Pi) — IMAGES PRÉ-CONSTRUITES
# ----------------------------------------------------------------------------
# Le Raspberry TÉLÉCHARGE des images déjà construites dans le cloud (GHCR),
# il ne compile RIEN → rapide, pas de surchauffe. Idéal pour dupliquer.
#
# Les images sont produites automatiquement par GitHub Actions à chaque
# « Save to GitHub » (voir .github/workflows/build-pi-images.yml).
#
# Lancement sur le Pi :
#   sudo docker compose -f docker-compose.pi.yml up -d
#
# Réseau "host" : indispensable pour le pilotage local Tuya (scan UDP) et l'AP.
# ============================================================================
name: zoneclimate

services:
  mongo:
    image: mongo:7
    container_name: zoneclimate-mongo
    restart: unless-stopped
    network_mode: host
    volumes:
      - mongo_data:/data/db

  backend:
    image: ghcr.io/${GHCR_OWNER:-anthonyvidal353-cpu}/zoneclimate-backend:latest
    pull_policy: always
    container_name: zoneclimate-backend
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/repo
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
    devices:
      - "${RS485_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0"
    group_add:
      - dialout
    environment:
      - MONGO_URL=mongodb://127.0.0.1:27017
      - DB_NAME=zoneclimate
      - TUYA_ENC_KEY=${TUYA_ENC_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CORS_ORIGINS=http://localhost:3000
      - FRONTEND_URL=http://localhost:3000
      - INAPP_UPDATE_ENABLED=${INAPP_UPDATE_ENABLED:-true}
      - REPO_DIR=/repo
      - HOST_REPO_DIR=${PWD}
      - PANEL_TOKEN=${PANEL_TOKEN:-ZONECLIMATE-PANEL-2026}
      - HOME_WIFI_IFACE=${HOME_WIFI_IFACE:-wlan0}
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/var/run/dbus/system_bus_socket
    depends_on:
      - mongo

  frontend:
    image: ghcr.io/${GHCR_OWNER:-anthonyvidal353-cpu}/zoneclimate-frontend:latest
    pull_policy: always
    container_name: zoneclimate-frontend
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend

  # Reverse proxy : une seule adresse (port 80) pour l'app + l'API.
  # Permet l'accès depuis un téléphone/PC du réseau : http://<IP_DU_PI>/
  proxy:
    image: nginx:alpine
    container_name: zoneclimate-proxy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./automate/nginx-pi.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  # Accès à distance pour les clients (URL publique via Cloudflare Tunnel).
  # Ne démarre QUE si activé : profil "remote" + CLOUDFLARE_TUNNEL_TOKEN dans .env
  #   sudo docker compose -f docker-compose.pi.yml --profile remote up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: zoneclimate-cloudflared
    restart: unless-stopped
    network_mode: host
    profiles: ["remote"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - proxy

volumes:
  mongo_data:
