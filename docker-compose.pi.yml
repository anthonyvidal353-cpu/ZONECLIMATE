# ============================================================================
# ClimaZone — Fichier Docker COMPLET pour l'automate (Raspberry Pi / Linux)
# ----------------------------------------------------------------------------
# Fichier AUTONOME (à utiliser SEUL, pas en surcharge du docker-compose.yml).
# Réseau "host" : indispensable pour le pilotage local Tuya (scan UDP + accès
# direct aux appareils sur le LAN) et pour le point d'accès Wi-Fi.
#
# Lancement sur le Pi :
#   sudo docker compose -f docker-compose.pi.yml up -d --build
# ============================================================================
name: zoneclimate

services:
  mongo:
    image: mongo:7
    container_name: zoneclimate-mongo
    restart: unless-stopped
    network_mode: host
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: zoneclimate-backend
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/repo
    # Convertisseur USB-RS485 (gainable A-B-GND). install-pi.sh détecte le port
    # réel et l'écrit dans RS485_DEVICE (.env).
    devices:
      - "${RS485_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0"
    group_add:
      - dialout
    environment:
      - MONGO_URL=mongodb://127.0.0.1:27017
      - DB_NAME=zoneclimate
      - TUYA_ENC_KEY=${TUYA_ENC_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CORS_ORIGINS=http://localhost:3000
      - FRONTEND_URL=http://localhost:3000
      - INAPP_UPDATE_ENABLED=${INAPP_UPDATE_ENABLED:-true}
      - REPO_DIR=/repo
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: http://localhost:8001
    container_name: zoneclimate-frontend
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend

volumes:
  mongo_data:
