; ============================================================================
; ClimaZone — Panneau tactile d'appairage (Waveshare ESP32-S3-Touch-LCD-4.3)
; ----------------------------------------------------------------------------
; Écran 4,3" 800x480 RGB + tactile capacitif GT911 + expandeur CH422G.
; Le panneau parle au backend de l'automate via l'API /api/panel/* (jeton fixe).
;
; ⚠️ Combinaison de versions VALIDÉE par la communauté pour cette carte :
;    - Arduino ESP32 core 2.x (platform espressif32 @ 6.5.0)
;    - LVGL 8.4.x  (LVGL 9 NON compatible avec ce code)
;    - Arduino_GFX (moononournation)
;    - bb_captouch (GT911)
;
; Compilation :  pio run
; Téléversement : pio run -t upload && pio device monitor
; ============================================================================
[env:waveshare_esp32s3_43]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Carte N8R8 : 8 Mo flash + 8 Mo PSRAM (OPI)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

build_flags =
    -D BOARD_HAS_PSRAM
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I src

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.4.9
    lvgl/lvgl @ ^8.4.0
    bitbank2/bb_captouch @ ^1.2.0
    bblanchon/ArduinoJson @ ^6.21.5
    ; Expandeur CH422G : si absent du registre PlatformIO, installe la lib
    ; "ESP32_IO_Expander" depuis le zip Waveshare (voir README.md).
    esp-arduino-libs/ESP32_IO_Expander @ ^0.1.0
