# Reverse proxy ClimaZone (automate) — une seule adresse pour tout.
# Accès depuis n'importe quel appareil du réseau : http://<IP_DU_PI>/
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 50m;

    # --- Portail captif : ouvre la page de connexion automatiquement ---
    # (Ces chemins ne sont sollicités que via le réseau « ZONECLIMATE ».)
    location = /generate_204            { return 302 http://10.42.0.1/; }
    location = /gen_204                 { return 302 http://10.42.0.1/; }
    location = /ncsi.txt                { return 302 http://10.42.0.1/; }
    location = /connecttest.txt         { return 302 http://10.42.0.1/; }
    location = /hotspot-detect.html     { return 302 http://10.42.0.1/; }
    location = /library/test/success.html { return 302 http://10.42.0.1/; }

    # API backend
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Interface web (servie par le conteneur frontend sur le port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
