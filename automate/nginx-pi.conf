# Reverse proxy ClimaZone (automate) — une seule adresse pour tout.
# Accès depuis n'importe quel appareil du réseau : http://<IP_DU_PI>/
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 50m;

    # --- Portail captif : page d'accueil STATIQUE (s'affiche dans la mini-fenêtre) ---
    # (Ces chemins ne sont sollicités que via le réseau « ZONECLIMATE ».)
    # IMPORTANT : la mini-fenêtre de portail captif des téléphones ne sait PAS
    # exécuter l'app React → on ne la redirige PAS vers l'app. On affiche une page
    # 100% statique avec un bouton + l'instruction d'ouvrir le navigateur (10.42.0.1).
    set $captive '<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClimaZone</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:24px;text-align:center}h1{margin:0 0 8px;font-size:28px}p{color:#cbd5e1;margin:6px 0;font-size:16px}.b{background:#7c3aed;color:#fff;text-decoration:none;padding:16px 32px;border-radius:999px;font-weight:700;display:inline-block;margin:18px 0 10px;font-size:18px}.ip{font-weight:700;color:#fff}.h{color:#94a3b8;font-size:14px;margin-top:14px}</style></head><body><div><h1>ClimaZone</h1><p>Connecte au reseau ZONECLIMATE.</p><a class="b" href="http://10.42.0.1/">Ouvrir ClimaZone</a><p class="h">Si la page reste blanche : ouvrez votre navigateur (Safari / Chrome) et tapez&nbsp;: <span class="ip">10.42.0.1</span></p></div></body></html>';
    location = /generate_204            { default_type text/html; return 200 $captive; }
    location = /gen_204                 { default_type text/html; return 200 $captive; }
    location = /ncsi.txt                { default_type text/html; return 200 $captive; }
    location = /connecttest.txt         { default_type text/html; return 200 $captive; }
    location = /hotspot-detect.html     { default_type text/html; return 200 $captive; }
    location = /library/test/success.html { default_type text/html; return 200 $captive; }
    location = /redirect                { default_type text/html; return 200 $captive; }
    location = /canonical.html          { default_type text/html; return 200 $captive; }

    # RFC 8908 : API de portail captif (pointée par l'option DHCP 114).
    # Indique au téléphone qu'il est "captif" + l'URL de l'app → ouverture auto.
    location = /captive-portal-api {
        default_type "application/captive+json";
        add_header Cache-Control "no-store";
        return 200 '{"captive":true,"user-portal-url":"http://10.42.0.1/"}';
    }
    location = /success.txt             { default_type text/html; return 200 $captive; }

    # API backend
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Interface web (servie par le conteneur frontend sur le port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
