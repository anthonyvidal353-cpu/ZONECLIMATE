# Reverse proxy ClimaZone (automate) — une seule adresse pour tout.
# Accès depuis n'importe quel appareil du réseau : http://<IP_DU_PI>/
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 50m;

    # --- Portail captif : ouvre la page de connexion automatiquement ---
    # (Ces chemins ne sont sollicités que via le réseau « ZONECLIMATE ».)
    # On sert une petite page HTML (200) qui redirige vers l'app : plus fiable
    # que le 302 cross-domaine dans les mini-navigateurs de portail captif.
    set $captive '<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=http://10.42.0.1/"><title>ClimaZone</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;text-align:center}a{background:#7c3aed;color:#fff;text-decoration:none;padding:14px 28px;border-radius:999px;font-weight:600;display:inline-block;margin-top:16px}</style></head><body><div><h1>ClimaZone</h1><p>Ouverture de la page de connexion…</p><a href="http://10.42.0.1/">Se connecter</a></div><script>location.replace("http://10.42.0.1/")</script></body></html>';
    location = /generate_204            { default_type text/html; return 200 $captive; }
    location = /gen_204                 { default_type text/html; return 200 $captive; }
    location = /ncsi.txt                { default_type text/html; return 200 $captive; }
    location = /connecttest.txt         { default_type text/html; return 200 $captive; }
    location = /hotspot-detect.html     { default_type text/html; return 200 $captive; }
    location = /library/test/success.html { default_type text/html; return 200 $captive; }
    location = /redirect                { default_type text/html; return 200 $captive; }
    location = /canonical.html          { default_type text/html; return 200 $captive; }
    location = /success.txt             { default_type text/html; return 200 $captive; }

    # API backend
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Interface web (servie par le conteneur frontend sur le port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
